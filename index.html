:root{--bg:#0f1226;--c:#1b1f3d;--t:#fff;--a:#7c5cff;--a2:#00d4ff;--ok:#2ecc71;--no:#ff5c7c}
@media(prefers-color-scheme:light){:root{--bg:#f2f4ff;--c:#fff;--t:#14163a}}
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--t);padding:14px 14px 90px;padding-top:max(14px,env(safe-area-inset-top))}
.blob{position:fixed;width:240px;height:240px;border-radius:50%;filter:blur(70px);opacity:.3;z-index:-1;animation:fl 9s ease-in-out infinite}
.b1{background:var(--a);top:-50px;left:-50px}.b2{background:var(--a2);bottom:40px;right:-60px;animation-delay:-4s}
@keyframes fl{50%{transform:translate(40px,30px) scale(1.2)}}
h1{margin:4px 0;animation:pop .6s}h2{margin:8px 0}@keyframes pop{from{transform:scale(.6);opacity:0}}
.xp{display:inline-block;background:linear-gradient(90deg,var(--a),var(--a2));color:#fff;padding:4px 12px;border-radius:20px;font-weight:700}
.s,small{opacity:.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.card{background:var(--c);border-radius:18px;padding:16px;opacity:0;animation:up .5s forwards;box-shadow:0 6px 18px #0003}
.card:active,.b:active,.row:active{transform:scale(.96)}.card span{font-size:30px;display:block}.card b{display:block}
@keyframes up{from{transform:translateY(30px)}to{opacity:1;transform:none}}
.bar{height:8px;background:#fff2;border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .6s}
.b{width:100%;margin-top:9px;padding:13px;border:0;border-radius:14px;background:var(--c);color:var(--t);font-size:16px;text-align:left;transition:.2s}
.b.m{background:linear-gradient(90deg,var(--a),var(--a2));color:#fff;text-align:center;font-weight:700}
.b.ok{background:var(--ok);color:#fff;animation:pu .4s}.b.no{background:var(--no);color:#fff;animation:sh .4s}
@keyframes pu{50%{transform:scale(1.05)}}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--c);border-radius:14px;padding:12px 14px;margin-top:8px;animation:up .4s forwards;transition:.2s}
.row.on{border-left:4px solid var(--ok)}.row button{border:0;background:none;font-size:22px;color:var(--t)}
.big{font-size:24px;font-weight:700;margin:18px 0 6px;animation:pop .4s}.txt{background:var(--c);padding:14px;border-radius:14px;line-height:1.6;white-space:pre-line}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #0004}
nav button{flex:1;border:0;background:none;color:var(--t);font-size:20px;padding:4px}nav small{display:block;font-size:10px}
.cf{position:fixed;top:-10px;font-size:24px;animation:fa 2.2s linear forwards;pointer-events:none}@keyframes fa{to{transform:translateY(105vh) rotate(540deg)}}
nav{justify-content:space-around;padding:8px 20px calc(8px + env(safe-area-inset-bottom))}
nav button{display:grid;place-items:center;opacity:.55;transition:.25s;padding:6px 18px;border-radius:16px}
nav button.on{opacity:1;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));transform:translateY(-4px) scale(1.08);box-shadow:0 6px 16px #0005}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;animation:pop .6s;box-shadow:0 6px 18px #0005}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:8px}.hd h1{margin:0;font-size:22px}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;margin-bottom:8px}
.sec{background:var(--c);border-radius:18px;padding:14px;margin-top:12px;animation:up .5s forwards}
.sw{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.sw i{width:44px;height:44px;border-radius:50%;border:3px solid transparent;transition:.2s}.sw i.sel{border-color:var(--t);transform:scale(1.15)}
.plan{background:var(--c);border-radius:22px;padding:18px;margin-top:14px;animation:up .5s forwards;position:relative;overflow:hidden}
.plan.pro{border:2px solid #4da3ff;box-shadow:0 0 24px #4da3ff55}.plan.sup{border:2px solid #ffc83d;box-shadow:0 0 28px #ffc83d66;background:linear-gradient(160deg,var(--c),#3a2d0a55)}
.plan.sup:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,#ffc83d33,transparent 30%);animation:rot 6s linear infinite;pointer-events:none}
@keyframes rot{to{transform:rotate(360deg)}}
.plan.banner{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#ffc83d,#ff7a3d);color:#2b1a00}.plan.banner small{color:#2b1a00}
.pl{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:#ffffff22}.plan.pro .pl{background:#4da3ff33}.plan.sup .pl{background:#ffc83d33}
.pr{font-size:28px;font-weight:800;margin:4px 0}.plan ul{list-style:none;padding:0;margin:10px 0}.plan li{padding:4px 0}
.ct{text-align:center;padding:22px}.ph{font-size:26px;font-weight:800;letter-spacing:1px;margin:10px 0;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
a.b{display:block;text-decoration:none;text-align:center;color:inherit}
.gm{animation:none!important;opacity:1!important;text-align:center;min-height:72px;display:grid;place-items:center;font-size:15px;transition:.25s}.gm.op{background:var(--a)!important;color:#fff;transform:rotateY(8deg)}.gm.dn{background:var(--ok)!important;color:#fff}
.in{width:100%;padding:13px;border:0;border-radius:14px;background:var(--c);color:var(--t);font-size:16px;margin:8px 0}
.logo.ai{background:linear-gradient(135deg,#7c5cff,#ff5c9a,#00d4ff);background-size:200% 200%;animation:pop .6s,gl 4s linear infinite}@keyframes gl{50%{background-position:100% 50%}}</style></head><body>

const BD=[["🌱","1 so'z",()=>nk()>=1],["📗","50 so'z",()=>nk()>=50],["📘","100 so'z",()=>nk()>=100],["🏆","250 so'z",()=>nk()>=250],["🔥","3 kun",()=>S.st>=3],["⚡","7 kun",()=>S.st>=7],["⭐","100 XP",()=>S.xp>=100],["💎","500 XP",()=>S.xp>=500]];

function home(){const p=Math.round(nk()/tot*100),[l,n]=lvl(),wd=Object.values(W).flat()[Math.floor(Date.now()/864e5)%tot],g=Math.min(100,(S.tx||0)*2);
A.innerHTML=`<div class=hd><div class=logo>${IC.cap}</div><div><h1>English Master</h1><span class=xp>⭐ ${S.xp} XP · Lv ${l} ${n}</span></div></div>
<div class=sec style="display:flex;justify-content:space-between"><div>🔥 <b>${S.st||1}</b> kun</div><div>🎯 ${S.tx||0}/50 XP</div></div><div class=bar><i style="width:${g}%"></i></div>
<div class=sec onclick="say('${wd[0]}')"><small>💡 Kun so'zi</small><div class=big style="margin:4px 0">${wd[0]} 🔊</div><small>${wd[1]}</small></div>
<p class=s>${tr("words")}: ${nk()}/${tot}</p><div class=bar><i style="width:${p}%"></i></div><div class=grid>${[["words","📖",tot+" ta"],["lessons","📚",L.length+" ta"],["listen","🎧",D.length+" dialog"],["speak","🎤",PH.length+" gap"],["reading","📰",RD.length+" matn"],["test","📝","kalitlari bilan"],["review","🔁","takrorlash"],["game","🎮","juftini top"],["search","🔍","so'z qidirish"],["more","📕","links"]].map((c,i)=>`<div class=card style="animation-delay:${i*.06}s" onclick="nav('${c[0]}')"><div class=ic style="background:linear-gradient(135deg,${GR[i%6][0]},${GR[i%6][1]})">${c[1]}</div><b>${tr(c[0]=="more"?"books":c[0]=="reading"?"read":c[0])}</b><small>${c[2]}</small></div>`).join("")}</div>`}
const RD=[{t:"My Day",e:"I get up at seven. I eat breakfast with my family. Then I go to school by bus. I study English and maths. After school I play football with my friends. In the evening I do my homework and read a book.",u:"Men soat yettida turaman. Oila bilan nonushta qilaman. Keyin avtobusda maktabga boraman. Ingliz tili va matematikani o'rganaman. Maktabdan keyin do'stlarim bilan futbol o'ynayman. Kechqurun uyga vazifa qilaman va kitob o'qiyman.",q:[["What time does he get up?","seven","eight","six",0],["How does he go to school?","by bus","by car","on foot",0],["What does he do in the evening?","plays football","does homework","sleeps",1]]},
{t:"A Trip to Samarkand",e:"Last summer we visited Samarkand. We travelled by train and it took three hours. We stayed in a small hotel near the Registan. The weather was hot, but the city was beautiful. We bought some bread and fruit at the market.",u:"O'tgan yozda Samarqandga bordik. Poyezdda ketdik va uch soat ketdi. Registon yaqinidagi kichik mehmonxonada qoldik. Havo issiq edi, lekin shahar chiroyli edi. Bozordan non va meva sotib oldik.",q:[["How did they travel?","by plane","by train","by bus",1],["Where did they stay?","in a hotel","with friends","in a tent",0],["How was the weather?","cold","rainy","hot",2]]},
{t:"My Friend Anna",e:"Anna is my best friend. She is twelve years old and she lives in London. She has a cat called Milo. She can speak three languages. Next year she is going to visit me in Tashkent.",u:"Anna mening eng yaqin do'stim. U o'n ikki yoshda va Londonda yashaydi. Uning Milo ismli mushugi bor. U uchta tilda gapira oladi. Kelasi yil u Toshkentga mening oldimga keladi.",q:[["How old is Anna?","ten","twelve","fourteen",1],["What is her cat's name?","Milo","Max","Tom",0],["How many languages can she speak?","two","three","four",1]]}];
function reading(){A.innerHTML=`<h2>📰 ${tr("read")}</h2>${RD.map((r,i)=>`<div class=row onclick="rd(${i})"><b>${r.t}</b>➡️</div>`).join("")}`}
function rd(i){const r=RD[i];ok(5);A.innerHTML=`<button class=b onclick="nav('reading')">⬅️</button><h2>${r.t}</h2><div class=txt>${r.e}</div><button class=b onclick="sayL(RD[${i}].e)">🔊 Tinglash</button><button class=b onclick="document.getElementById('uz').hidden=!document.getElementById('uz').hidden">🇺🇿 Tarjima</button><div class=txt id=uz hidden>${r.u}</div><button class="b m" onclick="rq(${i})">📝 Savollar</button>`}
function rq(i){run(RD[i].q.map(g=>({q:g[0],o:R(g.slice(1,4)),a:g[1+g[4]],x:"",h:"Reading: javobni tanlang"})),0,[])}
let RV=[];
function review(){RV=R(Object.values(W).flat().filter(w=>!S.k[w[0]])).slice(0,10);rv(0)}
function rv(n){if(n>=RV.length){ok(10);cf();return A.innerHTML=`<h1>🏆</h1><p>+10 XP</p><button class="b m" onclick="review()">🔁 Yana</button>`}const w=RV[n];A.innerHTML=`<p class=s>${n+1}/${RV.length}</p><div class=big onclick="say('${w[0]}')">${w[0]} 🔊</div><div class=big id=tw hidden>${w[1]}</div><button class="b m" onclick="document.getElementById('tw').hidden=false">👁 Tarjimani ko'rish</button><button class=b onclick="S.k['${w[0]}']=1;ok(2);rv(${n+1})">✅ Bilaman</button><button class=b onclick="rv(${n+1})">❌ Yana takrorlayman</button>`}
let GM;function game(){const p=R(Object.values(W).flat()).slice(0,6);GM={c:R(p.flatMap((w,i)=>[{i,t:w[0]},{i,t:w[1]}])),o:[],m:0,mv:0,lk:0};dg()}
function dg(){A.innerHTML=`<h2>🎮 ${tr("game")}</h2><p class=s>Inglizcha va o'zbekcha juftini toping · Yurish: ${GM.mv}</p><div class=grid style="grid-template-columns:repeat(3,1fr)">${GM.c.map((x,k)=>`<div class="card gm ${x.d?"dn":GM.o.includes(k)?"op":""}" onclick="gp(${k})"><b>${x.d||GM.o.includes(k)?x.t:"❓"}</b></div>`).join("")}</div>`}
function gp(k){if(GM.lk||GM.c[k].d||GM.o.includes(k))return;GM.o.push(k);if(GM.o.length==2){GM.mv++;const[a,b]=GM.o;if(GM.c[a].i==GM.c[b].i){GM.c[a].d=GM.c[b].d=1;GM.o=[];GM.m++;ok(3)}else{GM.lk=1;dg();setTimeout(()=>{GM.o=[];GM.lk=0;dg()},800);return}}dg();if(GM.m==6){ok(10);cf();A.insertAdjacentHTML("beforeend",`<h2>🏆 ${GM.mv} yurishda!</h2><button class="b m" onclick="game()">🔁 Yana</button>`)}}
function search(){A.innerHTML=`<h2>🔍 ${tr("search")}</h2><input class=in placeholder="apple / olma" oninput="sq(this.value)"><div id=sr></div>`}
function sq(v){v=v.trim().toLowerCase();document.getElementById("sr").innerHTML=v?Object.values(W).flat().filter(w=>w[0].toLowerCase().includes(v)||w[1].toLowerCase().includes(v)).slice(0,40).map(w=>`<div class=row onclick="say(this.dataset.t)" data-t="${w[0]}"><div><b>${w[0]}</b> 🔊<br><small>${w[1]}</small></div></div>`).join(""):""}

function aip(){const C=[["ai_tutor","👋","Tanishuv"],["ai_grammar","📚","Grammatikani tushuntir"],["ai_words","🔤","10 ta yangi so'z"],["ai_speak","🎤","Suhbat mashqi"],["ai_fix","✏️","Xatolarimni tuzat"],["ai_translate","🌍","Tarjimon"]];
A.innerHTML=`<div class="sec ct"><div class="logo ai" style="margin:0 auto">${IC.ai}</div><h2>AI Ustoz</h2><p class=s>Istalgan tilda so'rang: o'zbek, rus, ingliz, turk, arab...<br>Darslarni tushuntiradi, tarjima qiladi, xatolaringizni tuzatadi.</p><div style="font-size:26px;letter-spacing:6px">🇺🇿🇬🇧🇷🇺🇹🇷🇸🇦🇨🇳</div></div>
<div class=grid>${C.map((c,i)=>`<div class=card style="animation-delay:${i*.07}s" onclick="aio('${c[0]}')"><div class=ic style="background:linear-gradient(135deg,${GR[i%6][0]},${GR[i%6][1]})">${c[1]}</div><b>${c[2]}</b></div>`).join("")}</div>
<button class="b m" onclick="aio('')">💬 Suhbatni boshlash</button><p class=s style="text-align:center">Kuniga 15 ta savol bepul · 💎 Premium'da cheksiz</p>`}
function aio(p){const u="https://t.me/Anglish_Master_bot"+(p?"?start="+p:"");tg?.openTelegramLink?tg.openTelegramLink(u):window.open(u,"_blank")}

ap();home();
</script></body></html>
